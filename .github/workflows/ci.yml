name: Canvas 26.2 CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_server_gametest:
    name: Build + server GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build, unit tests, and real server GameTests
        run: gradle clean build --no-daemon --stacktrace

      - name: Inspect Fabric runtime artifact
        run: python3 scripts/verify_artifact.py build/libs/*.jar

      - name: Upload server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-server-evidence
          path: |
            build/reports/**
            build/test-results/**
            build/run/gameTest/**
          if-no-files-found: ignore

      - name: Upload candidate JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-26.2-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  client_gametest:
    name: Headless client + screenshots + companions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: build_server_gametest
    env:
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display and audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libopenal1

      - name: Resolve pinned companion mods
        run: python3 scripts/fetch_companions.py

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Launch production Minecraft client GameTests
        run: gradle runProductionClientGameTest --no-daemon --stacktrace

      - name: Collect client evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          find . -type f \( -name '*.png' -o -name 'latest.log' -o -name 'debug.log' -o -path '*/crash-reports/*' \) -print > ci-evidence/client/files.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            safe="$(echo "$file" | sed 's#^./##; s#/#__#g')"
            cp "$file" "ci-evidence/client/$safe"
          done < ci-evidence/client/files.txt

      - name: Upload client screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-client-evidence
          path: ci-evidence/client/**
          if-no-files-found: error

  candidate_gate:
    name: Proven candidate gate
    runs-on: ubuntu-24.04
    needs: [build_server_gametest, client_gametest]
    if: success()
    steps:
      - name: Candidate passed automated Minecraft validation
        run: |
          echo "Canvas candidate passed:"
          echo "- Java 25 compilation"
          echo "- Fabric Loom build for Minecraft 26.2"
          echo "- semantic HOME policy GameTests"
          echo "- all-Mob familiarity policy GameTests"
          echo "- real server GameTests"
          echo "- headless production client under Xvfb"
          echo "- Cool Rain + Sound Physics Remastered compatibility launch"
          echo "- artifact metadata/resources inspection"

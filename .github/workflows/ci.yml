name: Canvas 26.2 CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_server_gametest:
    name: Build + server GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install deterministic audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Canvas-owned ambience
        run: python3 scripts/generate_audio.py

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build, unit tests, and real server GameTests
        run: gradle clean build --no-daemon --stacktrace

      - name: Inspect Fabric runtime artifact
        run: python3 scripts/verify_artifact.py build/libs/*.jar

      - name: Upload server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-server-evidence
          path: |
            build/reports/**
            build/test-results/**
            build/run/gameTest/**
          if-no-files-found: ignore

      - name: Upload candidate JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-26.2-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  client_gametest:
    name: Client GameTests + production companions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build_server_gametest
    env:
      ALSOFT_DRIVERS: "null"
      CANVAS_VISUAL_TEST: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display, audio runtime, and encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libopenal1 ffmpeg

      - name: Generate Canvas-owned ambience
        run: python3 scripts/generate_audio.py

      - name: Resolve pinned companion mods
        run: python3 scripts/fetch_companions.py

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Run real Fabric client GameTests
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          set -o pipefail
          gradle runClientGameTest --no-daemon --stacktrace 2>&1 | tee ci-evidence/client/client-gametest-console.log
          grep -q "CANVAS_CI_VISUAL_ACTIVE" ci-evidence/client/client-gametest-console.log

      - name: Preserve client GameTest screenshots
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          find build/run/clientGameTest/screenshots -type f -name '*.png' -print -exec cp {} ci-evidence/client/ \;
          test "$(find ci-evidence/client -type f -name '*.png' | wc -l)" -ge 2

      - name: Launch packaged production client with companions
        run: gradle runProductionClientGameTest --no-daemon --stacktrace

      - name: Verify production client evidence
        run: python3 scripts/verify_client_runtime.py

      - name: Collect client logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          [ -f run/logs/latest.log ] && cp run/logs/latest.log ci-evidence/client/production-latest.log || true
          [ -f run/logs/debug.log ] && cp run/logs/debug.log ci-evidence/client/production-debug.log || true
          find . -type f -path '*/crash-reports/*' -exec cp {} ci-evidence/client/ \; || true

      - name: Upload client screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-client-evidence
          path: ci-evidence/client/**
          if-no-files-found: error

  candidate_gate:
    name: Proven candidate gate
    runs-on: ubuntu-24.04
    needs: [build_server_gametest, client_gametest]
    if: success()
    steps:
      - name: Candidate passed automated Minecraft validation
        run: |
          echo "Canvas candidate passed:"
          echo "- Java 25 compilation"
          echo "- Fabric Loom build for Minecraft 26.2"
          echo "- semantic HOME policy GameTests"
          echo "- all-Mob familiarity policy GameTests"
          echo "- real server GameTests"
          echo "- real client GameTests with screenshots"
          echo "- packaged production client under Xvfb"
          echo "- Cool Rain + Sound Physics Remastered compatibility launch"
          echo "- Canvas audio assets loaded without missing-resource warnings"
          echo "- artifact metadata/resources inspection"

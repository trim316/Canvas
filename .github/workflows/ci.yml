name: Canvas 26.2 CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_server_gametest:
    name: Build + server GameTests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install deterministic audio encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Canvas-owned ambience
        run: python3 scripts/generate_audio.py

      - name: Verify companion compatibility matrix contract
        run: python3 scripts/verify_compatibility_matrix.py

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Verify Canvas safety and loaded-only invariants
        run: python3 scripts/verify_invariants.py

      - name: Build, unit tests, and real server GameTests
        run: gradle clean build --no-daemon --stacktrace

      - name: Inspect Fabric runtime artifact
        run: python3 scripts/verify_artifact.py build/libs/*.jar

      - name: Record validated runtime source and digest attestation
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          python3 scripts/attest_artifact.py "$JAR" build/canvas-artifact-attestation.json
          python3 scripts/verify_artifact_provenance.py "$JAR" build/canvas-artifact-attestation.json
          python3 scripts/test_artifact_provenance.py

      - name: Upload tested runtime provenance
        uses: actions/upload-artifact@v4
        with:
          name: canvas-build-attestation
          path: build/canvas-artifact-attestation.json
          if-no-files-found: error

      - name: Upload server evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-server-evidence
          path: |
            build/reports/**
            build/test-results/**
            build/run/gameTest/**
          if-no-files-found: ignore

      - name: Upload candidate JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-26.2-candidate
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  client_gametest:
    name: Client GameTests + production companions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build_server_gametest
    env:
      ALSOFT_DRIVERS: "null"
      CANVAS_VISUAL_TEST: "true"
      CANVAS_SEASON_TEST: "winter"
      CANVAS_SNOW_TEST: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install virtual display, audio runtime, encoder, and image verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libgl1 libopenal1 ffmpeg python3-pil

      - name: Generate Canvas-owned ambience
        run: python3 scripts/generate_audio.py

      - name: Resolve complete companion stack
        run: python3 scripts/fetch_companions.py

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Automatically admit compatible cozy companions
        run: python3 scripts/admit_companions.py

      - name: Verify runtime companion admission against matrix
        run: python3 scripts/verify_compatibility_matrix.py ci-evidence/companion-admission.json

      - name: Run real Fabric client GameTests
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          set -o pipefail
          gradle runClientGameTest --no-daemon --stacktrace 2>&1 | tee ci-evidence/client/client-gametest-console.log
          grep -q "CANVAS_CI_VISUAL_ACTIVE" ci-evidence/client/client-gametest-console.log

      - name: Preserve client GameTest screenshots
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          find build/run/clientGameTest/screenshots -type f -name '*.png' -print -exec cp {} ci-evidence/client/ \;
          test "$(find ci-evidence/client -type f -name '*.png' | wc -l)" -ge 2

      - name: Launch packaged production client with companions
        env:
          CANVAS_COMPANION_DIR: ci-mods-active
        run: gradle runProductionClientGameTest --no-daemon --stacktrace

      - name: Verify production client log health
        run: python3 scripts/verify_log_health.py

      - name: Verify production client and visual FEEL evidence
        run: python3 scripts/verify_client_runtime.py

      - name: Collect client logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-evidence/client
          [ -f run/logs/latest.log ] && cp run/logs/latest.log ci-evidence/client/production-latest.log || true
          [ -f run/logs/debug.log ] && cp run/logs/debug.log ci-evidence/client/production-debug.log || true
          find . -type f -path '*/crash-reports/*' -exec cp {} ci-evidence/client/ \; || true

      - name: Upload client screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-client-evidence
          path: ci-evidence/client/**
          if-no-files-found: error

      - name: Upload exact validated companion stack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-companion-mods
          path: |
            ci-mods-active/*.jar
            ci-evidence/companion-admission.json
          if-no-files-found: error

  candidate_gate:
    name: Proven candidate gate
    runs-on: ubuntu-24.04
    needs: [build_server_gametest, client_gametest]
    if: success()
    steps:
      - name: Candidate passed automated Minecraft validation
        run: |
          echo "Canvas candidate passed:"
          echo "- Java 25 compilation"
          echo "- Fabric Loom build for Minecraft 26.2"
          echo "- semantic HOME loaded-world GameTests"
          echo "- Milestone-0 eight-moment scenario campaign"
          echo "- Seasons of Home four-season scenario campaign"
          echo "- persistent first-snow and seasonal-memory policy"
          echo "- bounded observation/performance policy"
          echo "- no-production-mutation / no-forced-chunk-load source gate"
          echo "- all-Mob familiarity policy GameTests"
          echo "- real server GameTests"
          echo "- real client GameTests with quantitative screenshot delta"
          echo "- packaged production client under Xvfb"
          echo "- automated ambience/music/footstep/weather/particle companion admission with incompatible optional mods quarantined"
          echo "- P3 multiplayer scenario campaign: shared settlement, world isolation, gathering, and persisted shared memory"
          echo "- deterministic 30-day long-session density soak"
          echo "- save/reload/backup/fork lineage isolation and legacy identity migration"
          echo "- explicit low-end block/entity observation and clustering budgets"
          echo "- machine-checked companion compatibility matrix with required/admit-or-quarantine policy"
          echo "- manifest-bound transactional installer, update backup, rollback, and bundle integrity verification"
          echo "- independent final release-candidate audit with exact runtime/bundle/admission hashes"
          echo "- Canvas audio assets loaded without missing-resource warnings"
          echo "- artifact metadata/resources inspection"

  package_candidate:
    name: Package proven playtest bundle
    runs-on: ubuntu-24.04
    needs: [candidate_gate]
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Download proven Canvas JAR
        uses: actions/download-artifact@v4
        with:
          name: canvas-26.2-candidate
          path: candidate

      - name: Download exact validated companion mods
        uses: actions/download-artifact@v4
        with:
          name: canvas-companion-mods
          path: companions

      - name: Download tested runtime provenance
        uses: actions/download-artifact@v4
        with:
          name: canvas-build-attestation
          path: attestation

      - name: Verify packaged artifact matches the exact tested build
        shell: bash
        run: |
          JAR="$(find candidate -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          python3 scripts/verify_artifact_provenance.py "$JAR" attestation/canvas-artifact-attestation.json

      - name: Build checksum-bound playtest bundle
        run: python3 scripts/package_candidate.py candidate companions dist/Canvas-26.2-PROVEN.zip

      - name: Verify proven playtest bundle and installer/update path
        run: python3 scripts/verify_bundle.py dist/Canvas-26.2-PROVEN.zip

      - name: Run independent release candidate audit
        shell: bash
        run: |
          ADMISSION="$(find companions -type f -name 'companion-admission.json' | head -n 1)"
          test -n "$ADMISSION"
          python3 scripts/release_candidate_audit.py \
            --jar "$(find candidate -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)" \
            --bundle dist/Canvas-26.2-PROVEN.zip \
            --admission "$ADMISSION" \
            --receipt dist/RELEASE-AUDIT.json

      - name: Upload proven playtest bundle
        uses: actions/upload-artifact@v4
        with:
          name: canvas-26.2-proven-bundle
          path: |
            dist/Canvas-26.2-PROVEN.zip
            dist/RELEASE-AUDIT.json
          if-no-files-found: error

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "canvas" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "canvas-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
        clearRunDirectory = true
        username = "CanvasCI"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods fileTree(dir: "ci-mods", include: ["*.jar"])
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

def canvasModVersion = project.mod_version

processResources {
    inputs.property "version", canvasModVersion
    filesMatching("fabric.mod.json") {
        expand "version": canvasModVersion
    }
}

tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests.set(false)
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    jvmArgs.add("-Dfabric.client.gametest")
    jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
    jvmArgs.add("-Dcanvas.home.requiredSamples=1")
    useXVFB = true
}
